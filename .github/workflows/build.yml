name: build

# 소스가 main 에 푸시되면 빌드하고, 버전이 올라갔으면 이 저장소의 Release(v1)에 업데이트 파일과 latest.json 을 올린다.
# 손으로 돌릴 때(workflow_dispatch) 태그를 바꾸면 시험용 Release(미리보기)에 올린다.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "올릴 Release 태그 (시험할 때만 바꾼다)"
        default: v1

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 7-Zip · Inno Setup 6 설치
        run: choco install 7zip innosetup -y --no-progress

      - name: Python 가상환경 만들기와 패키지 설치
        shell: cmd
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller

      - name: 네이티브 엔진 받기 (fetch_deps)
        shell: cmd
        run: .venv\Scripts\python.exe tools\fetch_deps.py

      - name: 빌드 (build.bat → setup.bat)
        shell: cmd
        run: |
          call build.bat
          call setup.bat

      - name: 설치 파일 해시 출력
        shell: pwsh
        run: |
          $f = Get-ChildItem setup\*.exe | Sort-Object LastWriteTime | Select-Object -Last 1
          Write-Host "설치 파일: $($f.Name)"
          Get-FileHash $f.FullName -Algorithm SHA256 | Format-List

      - name: 설치 파일 보관
        uses: actions/upload-artifact@v4
        with:
          name: mong-player-setup
          path: setup/*.exe
          if-no-files-found: error

      - name: 새 버전이면 Release 에 올리기
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/mong_publish.ps1 -App mongplayer -VersionFile 'noadplayer/__init__.py' -VersionPattern 'VERSION\s*=\s*"([^"]+)"' -File 'setup/*.exe' -AssetName MongPlayer-Setup.exe -Kind setup -Tag "${{ github.event.inputs.tag || 'v1' }}"
